version: '3'

services:
  message-broker:
    build:
      context: ../..
      dockerfile: examples/message_broker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GCORE_ENV=production
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - API_PORT=8080
      - MAX_QUEUE_SIZE=10000
      - MESSAGE_TTL=86400
      - CORS_ORIGINS=*
    depends_on:
      - valkey
    restart: unless-stopped
    networks:
      - message-broker-network

  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    command: ["--save", "60", "1", "--loglevel", "warning"]
    restart: unless-stopped
    networks:
      - message-broker-network

volumes:
  valkey-data:

networks:
  message-broker-network:
    driver: bridge