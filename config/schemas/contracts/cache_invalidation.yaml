contract:
  name: cache_invalidation
  component: gcore
  version: "1.0.0"
  stability: stable
  stream: "{site_id}:gnode:unified:{env}"
  consumer_group: gnode-daemon
  purpose: >
    Cache invalidation command sent by gCore to gNode daemon via the unified stream.
    Used when content changes require cached pages or objects to be purged.

  fields:
    - name: id
      type: string
      required: true
      description: "Unique request ID"
      example: "gcore-cache-inv-1713189600123"

    - name: command
      type: string
      required: true
      description: "Always GNODE_CACHE_INVALIDATE"
      example: "GNODE_CACHE_INVALIDATE"

    - name: parameters
      type: json
      required: true
      description: "Invalidation parameters: pattern (glob) or specific keys"
      example: '{"pattern":"page_cache:*","site_id":"example_com"}'

    - name: site_id
      type: string
      required: true
      description: "Site identifier"
      example: "example_com"

  xadd_example: >
    XADD {site_id}:gnode:unified:production *
    id gcore-cache-inv-001
    command GNODE_CACHE_INVALIDATE
    parameters '{"pattern":"page_cache:*","site_id":"example_com"}'
    site_id example_com
