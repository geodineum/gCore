# Geometric Topology Configuration
# This file defines the configuration for the Rust-based geometric topology engine.
# UPDATED: 2026-02-08 - Aligned with daemon's 23 semantic dimensions (19 discovery + 4 storage-only)

# Library configuration
library:
  path: "${GCORE_LIB_PATH:-lib/libgeometric_topology.so}"
  enabled: true
  use_for_bootstrap: true
  fallback_supported: true

# Daemon configuration (for gNode mode)
daemon:
  enabled: true
  path: "${GNODE_DAEMON_PATH:-/opt/geodineum/gnode-daemon/gnode-daemon}"
  stream_prefix: "gnode"
  auto_start: true
  timeout: 5.0
  retry_attempts: 3
  retry_delay: 0.5
  use_fallback: true
  cache_expiration: 300
  debug: false

# Use the external gNode client from /opt/gNode-Client (Composer-installed)
external_client:
  enabled: true
  path: "${GNODE_CLIENT_PATH:-/opt/geodineum/gNode-Client}"

# Capability space configuration - 23 semantic dimensions (19 discovery + 4 storage-only)
# See: daemon/functions/gnode_topology.lua for dimension definitions
dimensions: 23
capability_dimensions:
  # Layer 1: Interface Identity (0-3)
  protocol: 0           # http_rest|graphql|grpc|websocket|gnode_stream|resp3_direct|amqp|kafka|custom_tcp
  native_format: 1      # plaintext|json|xml|yaml|msgpack|protobuf|cbor|resp3|custom_binary
  api_version: 2        # Numeric: 0.0-1.0 (version semver normalized)
  contract_stability: 3 # experimental|alpha|beta|stable|frozen

  # Layer 2: Access Control (4-6)
  clearance_required: 4 # public|authenticated|authorized|privileged|confidential|classified
  auth_method: 5        # none|api_key|bearer_token|session_cookie|mtls|hardware_token
  data_sensitivity: 6   # public_data|internal|confidential|pii|regulated

  # Layer 3: Service Scope (7)
  service_scope: 7      # infrastructure|daemon|worker|cron_scheduled|internal_api|bff|client_facing|edge

  # Layer 4: Functional Domain (8-10)
  domain_primary: 8     # platform|identity|configuration|storage|cache|compute|transform|messaging|workflow|template|content|gateway|integration|analytics|logging|ml_inference|search|notification|presentation
  domain_secondary: 9   # Same as domain_primary (optional secondary domain)
  specialization: 10    # platform|generalist|focused|specialist|single_purpose

  # Layer 5: Performance Profile (11-13)
  throughput_tier: 11   # minimal|standard|professional|enterprise|hyperscale
  latency_class: 12     # realtime|interactive|responsive|patient|batch
  reliability_tier: 13  # best_effort|standard|high|critical|ultra

  # Layer 6: Workflow Context (14-15)
  pipeline_stage: 14    # source|ingest|process|enrich|deliver|sink
  execution_priority: 15 # background|low|normal|high|critical

  # Layer 7: Runtime State (16) - Dynamic
  current_load: 16      # idle|light|moderate|heavy|saturated

  # Layer 8: Classification (17-18)
  service_tier: 17      # tool|service|pipeline|infrastructure|orchestrator
  environment: 18       # global|testing|staging|acceptance|production

  # Layer 9: Visual Topology (19-21) - Storage-only, user-set positioning
  user_x: 19            # 0.0-1.0 horizontal position for graph rendering
  user_y: 20            # 0.0-1.0 vertical position for graph rendering
  user_z: 21            # 0.0-1.0 depth position for graph rendering

  # Layer 10: Temporal (22) - Storage-only, auto-injected by Lua
  registration_order: 22 # Monotonic counter normalized to 0.0-1.0


# Service tier mapping (for compatibility with old topology_tier)
# ROME=0.0, TOOL=0.1, SERVICE=0.2
# Now use: service_scope dimension instead

