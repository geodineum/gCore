      tier: "TOOL"
    capabilities:
      - name: "protocol"
        value: "gnode_stream"
      - name: "native_format"
        value: "json"
      - name: "contract_stability"
        value: "stable"
      - name: "clearance_required"
        value: "authenticated"
      - name: "domain_primary"
        value: "platform"
      - name: "specialization"
        value: "specialist"
      - name: "reliability_tier"
        value: "critical"
      - name: "service_scope"
        value: "daemon"

