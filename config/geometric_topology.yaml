# Geometric Topology Configuration
# This file defines the configuration for the Rust-based geometric topology engine.
# UPDATED: 2026-02-08 - Aligned with daemon's 23 semantic dimensions (19 discovery + 4 storage-only)

# Library configuration
library:
  path: "${GCORE_LIB_PATH:-lib/libgeometric_topology.so}"
  enabled: true
  use_for_bootstrap: true
  fallback_supported: true

# Daemon configuration (for gNode mode)
daemon:
  enabled: true
  path: "${GNODE_DAEMON_PATH:-/opt/geodineum/gnode-daemon/gnode-daemon}"
  stream_prefix: "gnode"
  auto_start: true
  timeout: 5.0
  retry_attempts: 3
  retry_delay: 0.5
  use_fallback: true
  cache_expiration: 300
  debug: false

# Use the external gNode client from /opt/gNode-Client (Composer-installed)
external_client:
  enabled: true
  path: "${GNODE_CLIENT_PATH:-/opt/geodineum/gNode-Client}"

# Capability space — 30 semantic dimensions (25 discovery + 5 storage-only).
#
# GENERATED from gNode/daemon/config/service_schema.yaml, which is the only
# source of truth. The daemon also publishes it to {ns}:gnode:schema:service
# at startup, so a running system can be asked rather than trusted.
#
# Do not hand-edit. This block sat at 23 dimensions with six indices pointing
# at the wrong slot for long enough that four other copies inherited it.
dimensions: 30
discovery_dimensions: 25
capability_dimensions:
  protocol: 0                     # undefined|http_rest|graphql|grpc|websocket|gnode_stream|resp3_direct|amqp|kafka|…
  native_format: 1                # undefined|plaintext|json|xml|yaml|msgpack|protobuf|cbor|resp3|…
  api_version: 2                  # v1|v2|v3|v4|v5
  contract_stability: 3           # experimental|alpha|beta|stable|frozen
  clearance_required: 4           # public|authenticated|authorized|privileged|confidential|classified
  auth_method: 5                  # none|api_key|bearer_token|session_cookie|mtls|hardware_token
  data_sensitivity: 6             # public_data|internal|confidential|pii|regulated
  service_scope: 7                # infrastructure|daemon|worker|cron_scheduled|internal_api|bff|client_facing|edge
  domain_primary: 8               # platform|identity|configuration|storage|cache|compute|transform|messaging|workflow|…
  domain_secondary: 9             # platform|identity|configuration|storage|cache|compute|transform|messaging|workflow|…
  specialization: 10              # platform|generalist|focused|specialist|single_purpose
  throughput_tier: 11             # minimal|standard|professional|enterprise|hyperscale
  latency_class: 12               # realtime|interactive|responsive|patient|batch
  reliability_tier: 13            # best_effort|standard|high|critical|ultra
  pipeline_stage: 14              # source|ingest|process|enrich|deliver|sink
  execution_priority: 15          # background|low|normal|high|critical
  current_load: 16                # idle|light|moderate|heavy|saturated
  health_status: 17               # dead|degraded|healthy|unknown
  lifecycle_state: 18             # registering|active|draining|stopped|failed
  service_tier: 19                # tool|service|pipeline|infrastructure|orchestrator
  environment: 20                 # global|testing|staging|acceptance|production
  implementation_language: 21     # rust|php|lua|python|go|javascript|bash
  network_zone: 22                # localhost|vpn|internal|dmz|public
  data_persistence: 23            # stateless|ephemeral|persistent|replicated
  update_channel: 24              # stable|beta|canary|pinned
  user_x: 25                      # left|center|right
  user_y: 26                      # bottom|middle|top
  user_z: 27                      # back|center|front
  deployment_model: 28            # bare_metal|container|serverless|embedded
  registration_order: 29          # first|early|middle|late|recent

services:
